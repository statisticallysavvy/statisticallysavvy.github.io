<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {{ page.title }} | {{ site.title }}
    </title>

    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}">

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>

    <script async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>

</head>

<body>

<header>
    <div class="container">

        <a class="logo"
           href="{{ '/' | relative_url }}">
            {{ site.title }}
        </a>

        <nav>
            <a href="{{ '/' | relative_url }}">Home</a>
            <a href="{{ '/blog/' | relative_url }}">Blog</a>
            <a href="{{ '/about/' | relative_url }}">About</a>
            <a href="{{ '/contact/' | relative_url }}">Contact</a>
        </nav>

    </div>
</header>


<main class="container">

    <article class="post">

        <h1>{{ page.title }}</h1>

        <p class="post-date">
            {{ page.date | date: "%B %d, %Y" }}
        </p>

        {{ content }}

    </article>

</main>


<footer>
    <div class="container">

        <p>
            © {{ site.time | date: '%Y' }} {{ site.author }}
        </p>

    </div>
</footer>

</body>
</html>
